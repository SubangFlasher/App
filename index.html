function rupiah(angka){return "Rp "+Number(angka).toLocaleString("id-ID")}
function renderIcons(){if(window.lucide)lucide.createIcons()}
function posisiBubble(){
 const wrapper=document.getElementById("liquid-wrapper");
 const bubble=document.getElementById("liquid-bubble-indicator");
 if(!wrapper||!bubble)return;
 const tabWidth=wrapper.clientWidth/6;
 const bubbleWidth=bubble.offsetWidth;
 const targetX=activeIndex*tabWidth+(tabWidth-bubbleWidth)/2;
 bubble.style.transform=`translateX(${Math.max(0,targetX)}px)`;
}
function gantiKategori(kategori,index){
 activeIndex=index;
 posisiBubble();
 document.getElementById("liquid-active-icon").innerHTML=`<i data-lucide="${iconNames[index]}" class="w-5 h-5"></i>`;
 document.querySelectorAll(".liquid-tab").forEach((btn,i)=>{
  const icon=btn.querySelector(".tab-icon"),label=btn.querySelector("span:last-child");
  const selected=i===index;
  icon.className=selected?"tab-icon text-transparent":"tab-icon text-gray-400";
  label.className=selected?"text-[9px] font-bold text-gray-200 mt-1":"text-[9px] font-medium text-gray-400 mt-1";
  btn.setAttribute("aria-current",selected?"page":"false");
 });
 const container=document.getElementById("daftar-produk");
 container.classList.remove("fade-in-content");void container.offsetWidth;container.classList.add("fade-in-content");
 const judul=document.getElementById("judul-kategori"),sub=document.getElementById("sub-judul-kategori");
 const namaKat={activasi:"Aktivasi Tool & Schematic",remote:"Pilihan Layanan Remote Service",imei:"Pilihan Layanan Pairing IMEI",sewa:"Pilihan Sewa Tool"};
 if(kategori==="infoserver"){judul.textContent="Status Jaringan & Server";sub.textContent="● Status informasi";renderInfoServer()}
 else if(kategori==="sosial"){judul.textContent="Sosial Media Resmi";sub.textContent="Hubungi Kami";renderSosial()}
 else{judul.textContent=namaKat[kategori]||"Layanan";sub.textContent="🔥 Populer";renderProduk(kategori)}
 renderIcons();
}
function renderProduk(kategori){
 const container=document.getElementById("daftar-produk");container.className="grid grid-cols-2 gap-3 fade-in-content";container.replaceChildren();
 const dataset={activasi:dataAktivasi,remote:dataRemote,imei:dataImei,sewa:dataSewa}[kategori]||[];
 dataset.forEach(item=>{
  const card=document.createElement("article");card.className="product-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm flex flex-col justify-between";
  const imageBox=document.createElement("div");imageBox.className="relative overflow-hidden aspect-[4/3] bg-slate-100 p-2";
  const img=document.createElement("img");img.src=item.foto;img.alt=item.nama;img.loading="lazy";img.className="product-image";
  img.onerror=function(){this.onerror=null;this.src="https://placehold.co/400x300/f1f5f9/dc2626?text=SUBANG+DEV"};
  imageBox.appendChild(img);
  const content=document.createElement("div");content.className="p-3";
  const title=document.createElement("h4");title.className="font-bold text-xs text-gray-900 leading-tight";title.textContent=item.nama;
  const desc=document.createElement("p");desc.className="text-gray-400 text-[10px] mt-1 mb-2.5 line-clamp-2";desc.textContent=item.fungsi;
  content.append(title,desc);
  const bottom=document.createElement("div");bottom.className="p-3 pt-0 flex items-center justify-between gap-1";
  const price=document.createElement("span");price.className="text-[10px] font-bold text-red-600";price.textContent="Mulai "+rupiah(item.hargaMulai.replace(/\./g,""));
  const button=document.createElement("button");button.type="button";button.className="bg-red-600 text-white text-[11px] font-semibold px-3 py-1.5 rounded-xl active:scale-95";button.textContent="Pilih";button.addEventListener("click",()=>bukaModal(item));
  bottom.append(price,button);card.append(imageBox,content,bottom);container.appendChild(card);
 });
}
function renderSosial(){
 const container=document.getElementById("daftar-produk");container.className="grid grid-cols-2 gap-3 fade-in-content";container.replaceChildren();
 dataSosial.forEach(item=>{
  const card=document.createElement("a");card.href=item.link;card.target="_blank";card.rel="noopener noreferrer";card.className="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center text-center justify-between min-h-32";
  const iconBox=document.createElement("div");iconBox.className="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center mb-2";
  const icon=document.createElement("i");icon.className=item.icon+" text-lg";iconBox.appendChild(icon);
  const title=document.createElement("h4");title.className="font-bold text-xs text-gray-900 mb-1";title.textContent=item.nama;
  const desc=document.createElement("p");desc.className="text-[10px] text-gray-400";desc.textContent=item.fungsi;
  card.append(iconBox,title,desc);container.appendChild(card);
 });
}
function renderInfoServer(){
 const container=document.getElementById("daftar-produk");container.className="grid grid-cols-1 gap-2.5 fade-in-content";container.replaceChildren();
 infoServerList.forEach(server=>{
  const card=document.createElement("div");card.className="flex items-center justify-between p-3.5 rounded-2xl border bg-emerald-50 border-emerald-100 shadow-sm";
  const left=document.createElement("div");left.className="flex items-center gap-3";
  const iconBox=document.createElement("div");iconBox.className="w-9 h-9 rounded-xl flex items-center justify-center bg-white shadow-sm";iconBox.innerHTML='<i data-lucide="server" class="w-4 h-4 text-red-600"></i>';
  const info=document.createElement("div");const title=document.createElement("h4");title.className="font-bold text-xs text-gray-900";title.textContent=server.nama;
  const subtitle=document.createElement("p");subtitle.className="text-[10px] text-gray-500 mt-0.5";subtitle.textContent="Informasi layanan server";
  info.append(title,subtitle);left.append(iconBox,info);
  const status=document.createElement("div");status.className="flex items-center gap-1.5 font-black text-xs px-3 py-1.5 rounded-xl bg-white border border-gray-100 text-glow-green";status.innerHTML='<i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i><span>ONLINE</span>';
  card.append(left,status);container.appendChild(card);
 });renderIcons();
}
function bukaModal(item){
 produkTerpilih=item;lastFocusedElement=document.activeElement;
 document.getElementById("modalNamaProduk").textContent=item.nama;
 document.getElementById("modalFungsiProduk").textContent=item.fungsi;
 const container=document.getElementById("modalVarianContainer");container.replaceChildren();
 item.varian.forEach((v,index)=>{
  const label=document.createElement("label");label.className="modal-option flex items-center justify-between gap-2 p-3.5 border border-gray-200 rounded-2xl cursor-pointer transition text-xs bg-white";
  const left=document.createElement("div");left.className="flex items-center gap-3";
  const radio=document.createElement("input");radio.type="radio";radio.name="durasi";radio.value=v[0];radio.dataset.harga=v[1];radio.checked=index===0;radio.className="accent-red-600 w-4 h-4";
  const name=document.createElement("span");name.className="font-bold text-gray-800 text-sm";name.textContent=v[0];
  const price=document.createElement("span");price.className="font-bold text-red-600 text-sm whitespace-nowrap";price.textContent=rupiah(v[1]);
  left.append(radio,name);label.append(left,price);container.appendChild(label);
 });
 const modal=document.getElementById("modalCheckout");modal.classList.remove("hidden");modal.classList.add("flex");renderIcons();
}
function tutupModal(){
 const modal=document.getElementById("modalCheckout");modal.classList.remove("flex");modal.classList.add("hidden");produkTerpilih=null;
 if(lastFocusedElement&&typeof lastFocusedElement.focus==="function")lastFocusedElement.focus();
}
function kirimKeWhatsApp(){
 if(!produkTerpilih){alert("Silakan pilih produk terlebih dahulu.");return}
 const selected=document.querySelector('input[name="durasi"]:checked');
 if(!selected){alert("Silakan pilih varian layanan terlebih dahulu!");return}
 const pesan=`Halo Admin Subang Dev, saya ingin memesan layanan digital berikut:\n\n📦 Layanan: ${produkTerpilih.nama}\n💡 Fungsi: ${produkTerpilih.fungsi}\n⚙️ Varian/Jenis: ${selected.value}\n💰 Total Biaya: ${rupiah(selected.dataset.harga)}\n\nMohon informasi langkah selanjutnya untuk proses pengerjaan/pembayaran.\n\nTerima kasih!`;
 const url=`https://wa.me/${nomorWhatsApp}?text=${encodeURIComponent(pesan)}`;
 const newWindow=window.open(url,"_blank","noopener,noreferrer");
 if(!newWindow)window.location.href=url;
 tutupModal();
}
function updateSlider(){
 const slider=document.getElementById("slider-container"),dots=document.querySelectorAll(".dot");
 slider.style.transform=`translateX(-${currentSlide*100}%)`;
 dots.forEach((dot,i)=>dot.className=i===currentSlide?"dot w-4 h-1.5 rounded-full bg-white transition-all duration-300":"dot w-1.5 h-1.5 rounded-full bg-white/60 transition-all duration-300");
}
function startSlider(){
 if(sliderTimer)clearInterval(sliderTimer);
 sliderTimer=setInterval(()=>{currentSlide=(currentSlide+1)%2;updateSlider()},4500);
}
document.querySelectorAll(".liquid-tab").forEach((btn,index)=>btn.addEventListener("click",()=>gantiKategori(btn.dataset.category,index)));
document.getElementById("btnTutupModal").addEventListener("click",tutupModal);
document.getElementById("btnBeli").addEventListener("click",kirimKeWhatsApp);
document.getElementById("modalCheckout").addEventListener("click",e=>{if(e.target===e.currentTarget)tutupModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("modalCheckout").classList.contains("hidden"))tutupModal()});
window.addEventListener("resize",posisiBubble);
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearInterval(sliderTimer);sliderTimer=null}else startSlider()});
window.addEventListener("load",()=>{gantiKategori("activasi",0);updateSlider();startSlider();renderIcons();requestAnimationFrame(posisiBubble)});
</script>
