// ======================================
// FORMAT RUPIAH
// ======================================

function rupiah(angka){
    return "Rp " + Number(angka).toLocaleString("id-ID");
}

// ======================================
// NAVIGASI
// ======================================

function gantiKategori(kategori,index){

    activeIndex=index;

    const wrapper=document.getElementById('liquid-wrapper');
    const bubble=document.getElementById('liquid-bubble-indicator');
    const activeIcon=document.getElementById('liquid-active-icon');

    const tabWidth=wrapper.clientWidth/6;
    const targetX=(index*tabWidth)+(tabWidth-60)/2;

    bubble.style.transform=`translateX(${targetX}px)`;

    activeIcon.innerHTML=
        `<i data-lucide="${iconNames[index]}" class="w-5 h-5"></i>`;

    document.querySelectorAll('.liquid-tab').forEach((btn,i)=>{
        const tabIcon=btn.querySelector('.tab-icon');
        const tabLabel=btn.querySelector('span:last-child');

        if(i===index){
            tabIcon.className="tab-icon text-transparent";
            tabLabel.className="text-[9px] font-bold text-gray-200 mt-1";
        }else{
            tabIcon.className="tab-icon text-gray-400";
            tabLabel.className="text-[9px] font-medium text-gray-400 mt-1";
        }
    });

    const container=document.getElementById('daftar-produk');
    container.classList.remove('fade-in-content');
    void container.offsetWidth;
    container.classList.add('fade-in-content');

    const judul=document.getElementById('judul-kategori');
    const sub=document.getElementById('sub-judul-kategori');

    if(kategori==='infoserver'){
        judul.textContent="Status Jaringan & Server";
        sub.textContent="● Real-time";
        renderInfoServer();
    }
    else if(kategori==='sosial'){
        judul.textContent="Sosial Media Resmi";
        sub.textContent="Hubungi Kami";
        renderSosial();
    }
    else{
        const namaKat={
            activasi:"Aktivasi",
            remote:"Remote Service",
            imei:"Pairing IMEI",
            sewa:"Sewa Tool"
        };

        judul.textContent=`Pilihan Layanan ${namaKat[kategori]}`;
        sub.textContent="🔥 Populer";
        renderProduk(kategori);
    }

    lucide.createIcons();
}

// ======================================
// RENDER PRODUK
// ======================================

function renderProduk(kategori){

    const container=document.getElementById('daftar-produk');
    container.className="grid grid-cols-2 gap-3 fade-in-content";
    container.innerHTML="";

    const dataset={
        activasi:dataAktivasi,
        remote:dataRemote,
        imei:dataImei,
        sewa:dataSewa
    }[kategori] || [];

    dataset.forEach(item=>{

        const card=document.createElement('div');
        card.className="product-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm flex flex-col justify-between";

        const imageBox=document.createElement('div');
        imageBox.className="relative overflow-hidden aspect-[4/3] bg-slate-100 p-2";

        const img=document.createElement('img');
        img.src=item.foto;
        img.alt=item.nama;
        img.className="product-image";

        img.onerror=function(){
            this.onerror=null;
            this.src="https://placehold.co/400x300/f1f5f9/dc2626?text=SUBANG+DEV";
        };

        imageBox.appendChild(img);

        const content=document.createElement('div');
        content.className="p-3";

        const title=document.createElement('h4');
        title.className="font-bold text-xs text-gray-900 leading-tight";
        title.textContent=item.nama;

        const description=document.createElement('p');
        description.className="text-gray-400 text-[10px] mt-1 mb-2.5 line-clamp-2";
        description.textContent=item.fungsi;

        content.append(title,description);

        const bottom=document.createElement('div');
        bottom.className="p-3 pt-0 flex items-center justify-between gap-1";

        const price=document.createElement('span');
        price.className="text-[10px] font-bold text-red-600";
        price.textContent="Mulai "+rupiah(item.hargaMulai.replace(/\./g,''));

        const button=document.createElement('button');
        button.className="bg-red-600 text-white text-[11px] font-semibold px-3 py-1.5 rounded-xl active:scale-95";
        button.textContent="Pilih";
        button.addEventListener('click',()=>bukaModal(item));

        bottom.append(price,button);
        card.append(imageBox,content,bottom);
        container.appendChild(card);
    });
}

    container.innerHTML="";

    infoServerList.forEach(server=>{

        const card=document.createElement('div');

        const left=document.createElement('div');
        left.className="flex items-center space-x-3";

        const iconBox=document.createElement('div');
        iconBox.className="w-9 h-9 rounded-xl flex items-center justify-center bg-white shadow-sm";

        iconBox.innerHTML='<i data-lucide="server" class="w-4 h-4 text-red-600"></i>';

        const info=document.createElement('div');

        const title=document.createElement('h4');
        title.className="font-bold text-xs text-gray-900";
        title.textContent=server.nama;

        const subtitle=document.createElement('p');
        subtitle.className="text-[10px] text-gray-500 mt-0.5";
        subtitle.textContent="Gateway & API Connected";

        info.append(title,subtitle);
        left.append(iconBox,info);

        const status=document.createElement('div');
        status.className="flex items-center gap-1.5 font-black text-xs px-3 py-1.5 rounded-xl bg-white border border-gray-100 text-glow-green";
        status.innerHTML='<i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i><span>ONLINE</span>';

        card.append(left,status);
        container.appendChild(card);
    });

    lucide.createIcons();
}

// ======================================
// CHECKOUT MODAL
// ======================================

function bukaModal(item){

    produkTerpilih=item;

    document.getElementById('modalNamaProduk').textContent=item.nama;
    document.getElementById('modalFungsiProduk').textContent=item.fungsi;

    const container=document.getElementById('modalVarianContainer');
    container.innerHTML="";

    item.varian.forEach((v,index)=>{

        const label=document.createElement('label');
        label.className="modal-option flex items-center justify-between p-3.5 border border-gray-200 rounded-2xl cursor-pointer transition text-xs bg-white";

        const left=document.createElement('div');
        left.className="flex items-center space-x-3";

        const radio=document.createElement('input');
        radio.type="radio";
        radio.name="durasi";
        radio.value=v[0];
        radio.dataset.harga=v[1];
        radio.checked=index===0;
        radio.className="accent-red-600 w-4 h-4";

        const name=document.createElement('span');
        name.className="font-bold text-gray-800 text-sm";
        name.textContent=v[0];

        const price=document.createElement('span');
        price.className="font-bold text-red-600 text-sm";
        price.textContent=rupiah(v[1]);

        left.append(radio,name);
        label.append(left,price);
        container.appendChild(label);
    });

    const modal=document.getElementById('modalCheckout');
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    lucide.createIcons();
}

function tutupModal(){

    const modal=document.getElementById('modalCheckout');
    modal.classList.remove('flex');
    modal.classList.add('hidden');

    produkTerpilih=null;
}

// ======================================
// KIRIM PESAN WHATSAPP
// ======================================

function kirimKeWhatsApp(){

    if(!produkTerpilih){
        alert("Silakan pilih produk terlebih dahulu.");
        return;
    }

    const selectedRadio=document.querySelector('input[name="durasi"]:checked');

    if(!selectedRadio){
        alert("Silakan pilih varian layanan terlebih dahulu!");
        return;
    }

    const varian=selectedRadio.value;
    const harga=selectedRadio.dataset.harga;

    const pesan=`Halo Admin Subang Dev, saya ingin memesan layanan digital berikut:

📦 Layanan: ${produkTerpilih.nama}
💡 Fungsi: ${produkTerpilih.fungsi}
⚙️ Varian/Jenis: ${varian}
💰 Total Biaya: ${rupiah(harga)}

Mohon informasi langkah selanjutnya untuk proses pengerjaan/pembayaran.

Terima kasih!`;

    const urlWA=`https://wa.me/${nomorWhatsApp}?text=${encodeURIComponent(pesan)}`;

    window.open(urlWA,'_blank');

    tutupModal();
}

// ======================================
// SLIDER OTOMATIS
// ======================================

function updateSlider(){

    const slider=document.getElementById('slider-container');
    const dots=document.querySelectorAll('.dot');

    slider.style.transform=`translateX(-${currentSlide*100}%)`;

    dots.forEach((dot,index)=>{
        dot.className=index===currentSlide
        ?"dot w-4 h-1.5 rounded-full bg-white transition-all duration-300"
        :"dot w-1.5 h-1.5 rounded-full bg-white/60 transition-all duration-300";
    });
}

setInterval(()=>{
    currentSlide=(currentSlide+1)%2;
    updateSlider();
},4000);

// ======================================
// RESIZE NAVIGASI
// ======================================

window.addEventListener('resize',()=>{

    const bubble=document.getElementById('liquid-bubble-indicator');
    const wrapper=document.getElementById('liquid-wrapper');

    const tabWidth=wrapper.clientWidth/6;
    const targetX=(activeIndex*tabWidth)+(tabWidth-60)/2;

    bubble.style.transform=`translateX(${targetX}px)`;
});

// ======================================
// TUTUP MODAL KLIK AREA LUAR
// ======================================

document.getElementById('modalCheckout').addEventListener('click',function(e){

    if(e.target===this){
        tutupModal();
    }
});

// ======================================
// ESCAPE KEY
// ======================================

document.addEventListener('keydown',e=>{
    if(e.key==="Escape"){
        tutupModal();
    }
});

// ======================================
// START WEBSITE
// ======================================

window.addEventListener('load',()=>{

    gantiKategori('activasi',0);
    updateSlider();
    lucide.createIcons();

});
</script>
