        /* LIQUID CURVED BUBBLE NAVIGATION STYLES PERSIS SEPERTI CONTOH */
        .liquid-nav-container {

            width: 100%;

            justify-content: center;
            padding: 10px 16px 20px 16px;
            background: transparent;
        }
        .liquid-nav-bar {
            position: relative;
            background: #181c24;
            border-radius: 28px;
            display: flex;
            width: 100%;
            max-width: 380px;
            height: 70px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            overflow: visible;
        }
        .liquid-bubble {
            position: absolute;
            top: -28px;
            left: 0;
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .liquid-items {
            position: absolute;
            inset: 0;
            display: flex;
            z-index: 20;
        }
        .liquid-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: transparent;
            border: none;
            padding-top: 4px;
        }

        @media (min-width: 768px) {

            const slider = document.getElementById('slider-container');
            const dots = document.querySelectorAll('.dot');
            if(slider) {
                slider.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach((dot, index) => {

        // Fungsi Ganti Kategori dengan Animasi Bubble Mengapung Persis Gambar Referensi
        function gantiKategori(kategori, index) {
            const wrapper = document.getElementById('liquid-wrapper');
            const bubble = document.getElementById('liquid-bubble-indicator');
            const activeIcon = document.getElementById('liquid-active-icon');

            // Kalkulasi posisi X persis di tengah tombol menu yang diklik (lebar bubble 60px)
            const tabWidth = wrapper.offsetWidth / 6;
            const targetX = (index * tabWidth) + (tabWidth / 2) - 30;
            bubble.style.transform = `translateX(${targetX}px)`;

            // Ganti icon di dalam bubble putih
            activeIcon.innerHTML = `<i data-lucide="${iconNames[index]}" class="w-5 h-5"></i>`;
            lucide.createIcons();

            // Sembunyikan icon pada baris bawah tab aktif, dan tampilkan kembali untuk tab non-aktif
            document.querySelectorAll('.liquid-tab').forEach((btn, i) => {
                const tabIcon = btn.querySelector('.tab-icon');
                const tabLabel = btn.querySelector('span:last-child');
                
                if (i === index) {
                    tabIcon.className = "tab-icon text-transparent";
                    tabLabel.className = "text-[9px] font-bold text-gray-200 mt-1";
                } else {
                    tabIcon.className = "tab-icon text-gray-400";
                    tabLabel.className = "text-[9px] font-medium text-gray-400 mt-1";
                }
            });

            const container = document.getElementById('daftar-produk');
            container.classList.remove('fade-in-content');
            void container.offsetWidth;
            container.classList.add('fade-in-content');

                        <span class="font-bold text-gray-800 text-sm">${v.durasi}</span>
                    </div>
                    <span class="font-bold text-red-600 text-sm">${v.label}</span>
                `;
                varianContainer.appendChild(label);
            });

            document.getElementById('modalCheckout').classList.remove('hidden');
            document.getElementById('modalCheckout').classList.add('flex');
        }

        function tutupModal() {
            document.getElementById('modalCheckout').classList.remove('flex');
            document.getElementById('modalCheckout').classList.add('hidden');
        }

        // Kirim WhatsApp
        function kirimKeWhatsApp() {
            const selectedRadio = document.querySelector('input[name="durasi"]:checked');
            if (!selectedRadio) {
                alert("Silakan pilih varian layanan terlebih dahulu!");
                return;
            }

            const varian = selectedRadio.value;
            const harga = selectedRadio.getAttribute('data-harga');

            const pesan = `Halo Admin Subang Dev, saya ingin memesan layanan digital berikut:

📦 *Layanan:* ${produkTerpilih.nama}
💡 *Fungsi:* ${produkTerpilih.fungsi}
⚙️ *Varian/Jenis:* ${varian}
💰 *Total Biaya:* Rp ${parseInt(harga).toLocaleString('id-ID')}

Mohon informasi langkah selanjutnya untuk proses pengerjaan/pembayaran. Terima kasih!`;

            const urlWA = `https://wa.me/${nomorWhatsApp}?text=${encodeURIComponent(pesan)}`;
            window.open(urlWA, '_blank');
            tutupModal();
        }

        window.onload = function() {
            gantiKategori('activasi', 0);
            updateSlider();
            lucide.createIcons();
        };

        window.onresize = function() {
            const activeIndex = iconNames.findIndex((icon, idx) => {
                const tabs = document.querySelectorAll('.tab-icon');
                return tabs[idx].classList.contains('text-transparent');
            });
            if(activeIndex !== -1) {
                gantiKategori(activeIndex === 0 ? 'activasi' : activeIndex === 1 ? 'remote' : activeIndex === 2 ? 'imei' : activeIndex === 3 ? 'sewa' : activeIndex === 4 ? 'sosial' : 'infoserver', activeIndex);
            }
        };
    </script>
</body>
</html>
